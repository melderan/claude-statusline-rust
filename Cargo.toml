[package]
name = "claude-statusline-rust"
version = "1.0.0"
edition = "2024"
description = "A fast status line for Claude Code: context use, prompt cache, git state and rate-limit pace, with no network access"
license = "Apache-2.0"
repository = "https://github.com/melderan/claude-statusline-rust"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
gix = "0.81"

[profile.release]
opt-level = "s"
lto = true
strip = true
