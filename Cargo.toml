[package]
name = "claude-statusline-rust"
version = "1.1.0"
edition = "2024"
description = "A fast status line for Claude Code: context use, prompt cache, git state and rate-limit pace, with no network access"
license = "Apache-2.0"
repository = "https://github.com/melderan/claude-statusline-rust"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
gix = "0.81"

[profile.release]
opt-level = "s"
lto = true
strip = true

# `cargo binstall claude-statusline-rust --git https://github.com/melderan/claude-statusline-rust`
# fetches the release archive for the host target instead of compiling. The templates match
# the names the release workflow publishes: one tar.gz per target, the binary inside a
# directory named after the archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
