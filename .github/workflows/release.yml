name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: claude-statusline-rust

jobs:
  verify-version:
    name: verify the tag (VERSIONING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is strict semver, annotated, signed, on main, and matches Cargo.toml, Cargo.lock and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag ${TAG} is not vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi
          version="${TAG#v}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Tag ${TAG} is lightweight. Releases use annotated, signed tags: git tag -s ${TAG}."
            exit 1
          fi
          if ! git cat-file tag "$TAG" | grep -q -- '-----BEGIN .*SIGNATURE-----'; then
            echo "::error::Tag ${TAG} is not signed. Releases use annotated, signed tags: git tag -s ${TAG}."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::The commit under ${TAG} is not on main."
            exit 1
          fi
          # Read the version from the [package] table only.
          cargo_version="$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/, ""); print; exit }' Cargo.toml)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${cargo_version}. Cut releases with scripts/release so the four numbers agree."
            exit 1
          fi
          lock_version="$(awk '/^name = "claude-statusline-rust"$/ { getline; gsub(/version = "|"/, ""); print; exit }' Cargo.lock)"
          if [ "$lock_version" != "$version" ]; then
            echo "::error::Cargo.lock records ${lock_version} for this package, not ${version}. Run cargo update --workspace and commit."
            exit 1
          fi
          if ! grep -q "^## \[${version}\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' heading. The release notes come from it."
            exit 1
          fi
          mkdir -p notes
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes/RELEASE_NOTES.md
          if [ ! -s notes/RELEASE_NOTES.md ]; then
            echo "::error::The [${version}] changelog section is empty."
            exit 1
          fi
          echo "Tag ${TAG}: annotated, signed, on main; Cargo.toml, Cargo.lock and CHANGELOG.md agree on ${version}."
          cat notes/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin_path="target/${TARGET}/release/${BIN}"
          strip "$bin_path"
          name="${BIN}-${TARGET}"
          rm -rf "dist/${name}"
          mkdir -p "dist/${name}"
          cp "$bin_path" "dist/${name}/"
          for extra in README.md LICENSE; do
            if [ -f "$extra" ]; then
              cp "$extra" "dist/${name}/"
            fi
          done
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          tar -tzf "dist/${name}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/${{ env.BIN }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ${{ env.BIN }}-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: notes/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
