name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: claude-statusline-rust

jobs:
  verify-version:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag with the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Read the version from the [package] table only.
          cargo_version="$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/, ""); print; exit }' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read the version from the [package] table in Cargo.toml."
            exit 1
          fi
          if [ "$TAG" != "v${cargo_version}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${cargo_version}. Bump the version in Cargo.toml, commit, and tag v${cargo_version}, or delete this tag and retag."
            exit 1
          fi
          echo "Tag ${TAG} matches Cargo.toml version ${cargo_version}."

  build:
    name: build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin_path="target/${TARGET}/release/${BIN}"
          strip "$bin_path"
          name="${BIN}-${TARGET}"
          rm -rf "dist/${name}"
          mkdir -p "dist/${name}"
          cp "$bin_path" "dist/${name}/"
          for extra in README.md LICENSE; do
            if [ -f "$extra" ]; then
              cp "$extra" "dist/${name}/"
            fi
          done
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          tar -tzf "dist/${name}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/${{ env.BIN }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ${{ env.BIN }}-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
